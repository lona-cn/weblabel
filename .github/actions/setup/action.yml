name: Pinned build toolchain
description: Exact project pins, frozen dependencies, no model extras
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24.16.0'
        package-manager-cache: false
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: '10.34.5'
        cache: true
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13.16'
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: '0.12.17'
        enable-cache: true
        cache-dependency-glob: services/detector/uv.lock
    - name: Install exact Rust and WASM target
      shell: bash
      run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: cargo-only-pinned-1.96.0-bindgen-0.2.128-pack-0.15.0
        workspaces: . -> target/cargo-ci
        cache-bin: true
    - name: Prepare exact CLI pins and selected runtime paths
      shell: bash
      run: node scripts/ci-setup.mjs
    - name: Frozen JavaScript dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
