name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.1.0-ci
      publish-image:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.version || 'push' }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version || '0.1.0-ci' }}
  test:
    needs: build
    uses: ./.github/workflows/test.yml
  container:
    needs: [build, test]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr.yml
    with:
      publish: ${{ inputs.publish-image || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      version: ${{ inputs.publish-image && inputs.version || '' }}
