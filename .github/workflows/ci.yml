name: CI
on:
  push:
  pull_request:
jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - run: cargo test --workspace --locked
  typescript:
    runs-on: windows-latest
    env:
      WEBLABEL_CARGO_CWD: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: rustfmt
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-web-bridge.mjs
      - run: node scripts/build-agent-host.mjs
      - run: pnpm test:unit --maxWorkers=1
      - run: node scripts/verify.mjs fast --skip-security --report-dir reports/T35/ci/fast
  wasm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - run: cargo build -p renderer-wgpu --target wasm32-unknown-unknown --locked
      - run: cargo build -p wasm-bridge --target wasm32-unknown-unknown --locked
  software-gpu:
    name: Software GPU diagnostics (not G2 hardware acceptance)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.15.0 --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:gpu:software
