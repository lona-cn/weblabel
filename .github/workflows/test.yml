name: Real engineering tests
on:
  workflow_call:
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.96.0'
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/cargo-ci
jobs:
  suite:
    name: Tests ${{ matrix.platform }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.platform }}-x64
          path: target/ci-artifacts
      - name: Check downloaded archive SHA256 and commit
        run: node scripts/unpack-release.mjs --artifact-dir target/ci-artifacts --output-dir target/ci-unpacked --expected-commit ${{ github.sha }}
      - name: Test real Rust, Web, Host, API, contracts and offline detector
        env:
          WEBLABEL_T33_DIAGNOSTICS_DIR: ${{ github.workspace }}/target/ci-diagnostics/t33
        run: node scripts/ci-tests.mjs --release-dir target/ci-unpacked/release
      - name: Preserve this run's sanitized physical shutdown observations
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: physical-shutdown-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci-diagnostics/t33/**/direct-api.json
            target/ci-diagnostics/t33/**/direct-api.log
            target/ci-diagnostics/t33/**/packaged.json
            target/ci-diagnostics/t33/**/packaged.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Install actual Chromium
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - name: Actual wgpu software device function tests (not hardware/G4)
        if: runner.os == 'Windows'
        run: pnpm test:gpu:software
      - name: Preserve this run's T00-only WebGPU capability observations
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-wgpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/**/t00-webgpu-capability.json
            test-results/**/t00-webgpu-capability.png
          if-no-files-found: ignore
          retention-days: 7
