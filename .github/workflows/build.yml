name: Build portable releases
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.1.0-ci
permissions:
  contents: read
env:
  RUSTUP_TOOLCHAIN: '1.96.0'
  CARGO_INCREMENTAL: '0'
jobs:
  native:
    name: Build ${{ matrix.platform }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win32
          - os: ubuntu-24.04
            platform: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build API, canonical Rust Core WASM, React and Host
        run: node scripts/build.mjs --build-dir target/ci-release
      - name: Package pinned runtime and startup/backup/restore CLI
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/package-release.mjs --build-dir target/ci-release --output-dir target/ci-dist --version "$env:RELEASE_VERSION"
        shell: pwsh
      - name: Validate actual downloadable archive and source SHA
        run: node scripts/unpack-release.mjs --artifact-dir target/ci-dist --output-dir target/ci-unpacked --expected-commit ${{ github.sha }}
      - name: Run unpacked standalone application and persistence smoke
        env:
          BUNDLE_DIR: ${{ github.workspace }}/target/ci-unpacked
        shell: pwsh
        run: node scripts/release-smoke.mjs --bundle-dir "$env:BUNDLE_DIR"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}-x64
          path: |
            target/ci-dist/*.tar.gz
            target/ci-dist/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
