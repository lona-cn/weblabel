[package]
name = "weblabel-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "weblabel-api"
path = "src/main.rs"

[dependencies]
annotation-domain = { path = "../annotation-domain" }
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "std"] }
exif = { package = "kamadak-exif", version = "=0.6.1" }
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png"] }
serde = { version = "=1.0.229", features = ["derive"] }
axum = { version = "=0.8.6", features = ["multipart"] }
argon2 = { version = "=0.5.3", features = ["std"] }
rand = { version = "=0.8.5", features = ["getrandom"] }
serde_json = "=1.0.147"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "=1.18.1", features = ["v4", "v5"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "=3.23.0"
