[package]
name = "weblabel-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "weblabel-api"
path = "src/main.rs"

[dependencies]
annotation-domain = { path = "../annotation-domain" }
axum = "=0.8.6"
serde_json = "=1.0.147"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "=2.0.17"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread", "time"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }

[dev-dependencies]
tempfile = "=3.23.0"
