[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
annotation-domain = { path = "../annotation-domain" }
schemars = "=0.8.22"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.147"
ts-rs = { version = "=10.1.0", features = ["serde-compat", "no-serde-warnings"] }
